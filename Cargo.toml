[workspace]
members = ["crates/*"]
default-members = [
    "crates/tinyagents-harness",
    "crates/tinyagents-graph",
    "crates/tinyagents-tasks",
    "crates/tinyagents-registry",
    "crates/tinyagents-session",
    "crates/tinyagents-runtime",
    "crates/tinyagents-hooks",
    "crates/tinyagents-orchestration",
    "crates/tinyagents-live",
]
exclude = ["vendor", "worktrees", "integration-proofs/run-ledger-mongodb"]
resolver = "3"

[workspace.package]
version = "2.2.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tinyagents"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
cap-std = "4"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tempfile = "3"
rustix = { version = "1.1", features = ["fs"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
# Storage ports from one TinyStorageDrivers source for every adapter and port
# type. Pin the merged fork-epic revision that adds read-only SQLite opening;
# the public v1.0.0 tag does not contain that API yet.
tinystoragedrivers-core = { version = "1.0.0", git = "https://github.com/senamakel/tinystoragedrivers", rev = "d507a31d5b08cb61f08636a6886fd5dbc18b9442" }
tinystoragedrivers-file = { version = "1.0.0", git = "https://github.com/senamakel/tinystoragedrivers", rev = "d507a31d5b08cb61f08636a6886fd5dbc18b9442" }
tinystoragedrivers-sqlite = { version = "1.0.0", git = "https://github.com/senamakel/tinystoragedrivers", rev = "d507a31d5b08cb61f08636a6886fd5dbc18b9442" }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# `tinyinference-llm` names `tinytools-agent` as a git dependency (it is not on
# crates.io). Inside this workspace that crate is the vendored submodule, so the
# git source is redirected onto the path — one copy of the protocol crate in the
# graph, and the harness's `path` dependency and the provider's dependency are
# the same type.
[patch."https://github.com/tinyhumansai/tinytools"]
tinytools-agent = { path = "vendor/tinytools/crates/tinytools-agent" }
tinytools = { path = "vendor/tinytools/crates/tinytools" }

