[package]
name = "tinyagents-native-run-ledger-mongodb-proof"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

# Separate graph: BSON enables serde_json/preserve_order, which must not
# change the ordinary TinyAgents workspace's feature composition.
[workspace]
resolver = "3"

[features]
default = []
mongodb-storage-tests = [
    "dep:tinystoragedrivers-api",
    "dep:tinystoragedrivers-connect",
    "dep:tinystoragedrivers-document",
    "dep:tinystoragedrivers-testkit",
    "dep:tinystoragedrivers-types",
    "dep:tinyagents-session",
    "dep:tinyagents-storage-kit",
]

[dependencies]
reqwest = { version = "0.12", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
tinystoragedrivers-api = { git = "https://github.com/senamakel/tinystoragedrivers", tag = "v2.0.1", version = "2.0.1", optional = true }
tinystoragedrivers-connect = { git = "https://github.com/senamakel/tinystoragedrivers", tag = "v2.0.1", version = "2.0.1", features = ["mongodb"], optional = true }
tinystoragedrivers-document = { git = "https://github.com/senamakel/tinystoragedrivers", tag = "v2.0.1", version = "2.0.1", default-features = false, features = ["mongodb"], optional = true }
tinystoragedrivers-testkit = { git = "https://github.com/senamakel/tinystoragedrivers", tag = "v2.0.1", version = "2.0.1", optional = true }
tinystoragedrivers-types = { git = "https://github.com/senamakel/tinystoragedrivers", tag = "v2.0.1", version = "2.0.1", optional = true }
tinyagents-session = { path = "../../crates/tinyagents-session", features = ["storage-drivers", "testkit"], optional = true }
tinyagents-storage-kit = { path = "../../crates/tinyagents-storage-kit", optional = true }

[patch."https://github.com/tinyhumansai/tinytools"]
tinytools-agent = { path = "../../vendor/tinytools/crates/tinytools-agent" }
tinytools = { path = "../../vendor/tinytools/crates/tinytools" }

[lints.rust]
unsafe_code = "deny"
