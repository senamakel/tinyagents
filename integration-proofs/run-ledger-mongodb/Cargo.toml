[package]
name = "tinyagents-native-run-ledger-mongodb-proof"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

# Separate graph: BSON enables serde_json/preserve_order, which must not
# change the ordinary TinyAgents workspace's feature composition.
[workspace]
resolver = "3"

[features]
default = []
mongodb-storage-tests = [
    "dep:tinystoragedrivers-core",
    "dep:tinystoragedrivers-mongodb",
    "dep:tinyagents-session",
    "dep:tinyinference-llm",
]

[dependencies]
chrono = "0.4"
reqwest = { version = "0.12", default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
tinystoragedrivers-core = { git = "https://github.com/senamakel/tinystoragedrivers", rev = "d507a31d5b08cb61f08636a6886fd5dbc18b9442", optional = true }
tinystoragedrivers-mongodb = { git = "https://github.com/senamakel/tinystoragedrivers", rev = "d507a31d5b08cb61f08636a6886fd5dbc18b9442", optional = true }
tinyagents-session = { path = "../../crates/tinyagents-session", features = ["storage-drivers"], optional = true }
tinyinference-llm = { path = "../../vendor/tinyinference/crates/tinyinference-llm", optional = true }

[patch."https://github.com/tinyhumansai/tinytools"]
tinytools-agent = { path = "../../vendor/tinytools/crates/tinytools-agent" }
tinytools = { path = "../../vendor/tinytools/crates/tinytools" }

[patch."https://github.com/tinyhumansai/tinystoragedrivers"]
tinystoragedrivers-core = { git = "https://github.com/senamakel/tinystoragedrivers", rev = "d507a31d5b08cb61f08636a6886fd5dbc18b9442" }
tinystoragedrivers-file = { git = "https://github.com/senamakel/tinystoragedrivers", rev = "d507a31d5b08cb61f08636a6886fd5dbc18b9442" }
tinystoragedrivers-mongodb = { git = "https://github.com/senamakel/tinystoragedrivers", rev = "d507a31d5b08cb61f08636a6886fd5dbc18b9442" }
tinystoragedrivers-secrets = { git = "https://github.com/senamakel/tinystoragedrivers", rev = "d507a31d5b08cb61f08636a6886fd5dbc18b9442" }
tinystoragedrivers-sqlite = { git = "https://github.com/senamakel/tinystoragedrivers", rev = "d507a31d5b08cb61f08636a6886fd5dbc18b9442" }

[lints.rust]
unsafe_code = "deny"
