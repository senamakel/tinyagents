[package]
name = "tinyagents-integration-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
dotenvy = "0.15"
futures = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tinyagents-graph = { path = "../tinyagents-graph" }
tinyagents-harness = { path = "../tinyagents-harness" }
tinyagents-orchestration = { path = "../tinyagents-orchestration" }
tinyagents-definition = { path = "../tinyagents-definition" }
tinyagents-registry = { path = "../tinyagents-registry" }
tinyagents-session = { path = "../tinyagents-session" }
tinyinference-llm = { path = "../../vendor/tinyinference/crates/tinyinference-llm", version = "0.4.1" }
tinyinference-embeddings = { path = "../../vendor/tinyinference/crates/tinyinference-embeddings", version = "0.4.1" }
tinytools = { path = "../../vendor/tinytools/crates/tinytools", version = "0.5.0" }
tokio = { workspace = true, default-features = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }

[dev-dependencies]
tinyagents-storage-kit = { path = "../tinyagents-storage-kit" }
tinyagents-session = { path = "../tinyagents-session", features = ["testkit"] }
tinystoragedrivers-api = { workspace = true }
tinystoragedrivers-connect = { workspace = true }
tinystoragedrivers-document = { workspace = true }
tinystoragedrivers-testkit = { workspace = true }
tinystoragedrivers-types = { workspace = true }

[features]
default = []
# Retained as a no-op: SQLite persistence is the tinystoragedrivers SQLite driver.
sqlite = []
# `tools` is kept as the forwarded feature name for backward compatibility
# (see `tinyagents-harness`'s deprecated `tools` alias for `builtin-tools`).
tools = ["tinyagents-harness/builtin-tools"]
multimodal = ["tinyagents-harness/multimodal"]
claude-code = ["tinyagents-harness/claude-code"]
langfuse = ["tinyagents-harness/langfuse"]
tracing = [
    "tinyagents-graph/tracing",
    "tinyagents-harness/tracing",
    "tinyagents-registry/tracing",
    "tinyagents-session/tracing",
]

[lints.rust]
unused_imports = "allow"
