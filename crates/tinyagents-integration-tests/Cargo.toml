[package]
name = "tinyagents-integration-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
dotenvy = "0.15"
futures = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tinyagents-graph = { path = "../tinyagents-graph" }
tinyagents-harness = { path = "../tinyagents-harness" }
tinyagents-language = { path = "../tinyagents-language" }
tinyagents-orchestration = { path = "../tinyagents-orchestration" }
tinyagents-registry = { path = "../tinyagents-registry" }
tinyagents-session = { path = "../tinyagents-session" }
tinyinference-llm = { path = "../../vendor/tinyinference/crates/tinyinference-llm", version = "0.3.0" }
tinyinference-embeddings = { path = "../../vendor/tinyinference/crates/tinyinference-embeddings", version = "0.3.0" }
tinytools = { path = "../../vendor/tinytools/crates/tinytools", version = "0.2.0" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }

[features]
default = []
sqlite = ["tinyagents-graph/sqlite", "tinyagents-harness/sqlite"]
tools = ["tinyagents-harness/tools"]
multimodal = ["tinyagents-harness/multimodal"]
tracing = [
    "tinyagents-graph/tracing",
    "tinyagents-harness/tracing",
    "tinyagents-registry/tracing",
    "tinyagents-session/tracing",
]

[lints.rust]
unused_imports = "allow"
