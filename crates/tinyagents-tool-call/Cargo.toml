[package]
publish = false
name = "tinyagents-tool-call"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Agent-facing tool-call parsing, rendering, dialects, and transcript blocks."

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tinyagents-tracing = { path = "../tinyagents-tracing", version = "2.1.2", default-features = false }
tinyinference = { path = "../../vendor/tinyinference/crates/tinyinference", version = "0.2.1" }

[features]
default = []
tracing = ["tinyagents-tracing/tracing"]

[lints]
workspace = true
