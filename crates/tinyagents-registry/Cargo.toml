[package]
publish = false
name = "tinyagents-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Named capability registry and offline model catalog."

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tinyagents-definition = { path = "../tinyagents-definition", version = "2.1.2" }
tinyagents-harness = { path = "../tinyagents-harness", version = "2.1.2", default-features = false }
tinyinference-llm = { path = "../../vendor/tinyinference/crates/tinyinference-llm", version = "0.3.0" }
tinytools = { path = "../../vendor/tinytools/crates/tinytools", version = "0.4.1" }

[features]
default = []
tracing = ["tinyagents-harness/tracing"]

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
