[package]
publish = false
name = "tinyagents-session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Durable TinyAgents session history and run ledger."

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
async-trait = "0.1"
log = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tinyagents-harness = { path = "../tinyagents-harness", version = "2.1.2", default-features = false, features = ["sqlite"] }
tinyagents-tracing = { path = "../tinyagents-tracing", version = "2.1.2", default-features = false }
tinyinference-llm = { path = "../../vendor/tinyinference/crates/tinyinference-llm", version = "0.3.0" }

[features]
default = []
tracing = ["tinyagents-harness/tracing", "tinyagents-tracing/tracing"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
