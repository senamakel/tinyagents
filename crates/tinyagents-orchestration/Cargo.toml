[package]
publish = false
name = "tinyagents-orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Host-neutral composition primitives for TinyAgents work."

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
parking_lot = "0.12"
serde = { workspace = true }
serde_json = { workspace = true }
tinyagents-graph = { path = "../tinyagents-graph", version = "2.1.2", default-features = false }
tinyagents-harness = { path = "../tinyagents-harness", version = "2.1.2", default-features = false }
tinyagents-session = { path = "../tinyagents-session", version = "2.1.2", default-features = false }
tinyagents-runtime = { path = "../tinyagents-runtime", version = "2.1.2", default-features = false }
tinyinference-llm = { path = "../../vendor/tinyinference/crates/tinyinference-llm", version = "0.3.0" }
tokio = { workspace = true, features = ["sync", "rt", "macros"] }
uuid = { workspace = true }

[features]
default = []
tracing = [
    "tinyagents-graph/tracing",
    "tinyagents-harness/tracing",
    "tinyagents-session/tracing",
]
# Lowers `WorkflowDefinition` to a `tinyagents_graph::CompiledGraph` and lets
# `WorkflowEngine::drive` dispatch to it (see `workflow::lower`) instead of
# the legacy one-phase-at-a-time scheduler loop. See
# `crates/tinyagents-orchestration/src/workflow/README.md`.
graph-workflows = []

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, default-features = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
