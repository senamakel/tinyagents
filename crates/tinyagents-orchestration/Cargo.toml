[package]
publish = false
name = "tinyagents-orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-neutral composition primitives for TinyAgents work."

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tinyagents-graph = { path = "../tinyagents-graph", version = "2.1.2", default-features = false }
tinyagents-harness = { path = "../tinyagents-harness", version = "2.1.2", default-features = false }
tinyagents-session = { path = "../tinyagents-session", version = "2.1.2", default-features = false }
tokio = { version = "1", default-features = false, features = ["sync", "rt", "macros"] }
uuid = { version = "1", features = ["v4"] }

[features]
default = []
tracing = [
    "tinyagents-graph/tracing",
    "tinyagents-harness/tracing",
    "tinyagents-session/tracing",
]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
