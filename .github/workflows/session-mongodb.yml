name: Session MongoDB conformance

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/tinyagents-session/**"
      - "integration-proofs/run-ledger-mongodb/**"
      - ".github/scripts/start-session-mongo-replset.sh"
      - ".github/workflows/session-mongodb.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/tinyagents-session/**"
      - "integration-proofs/run-ledger-mongodb/**"
      - ".github/scripts/start-session-mongo-replset.sh"
      - ".github/workflows/session-mongodb.yml"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mongo-conformance:
    name: MongoDB session-store and run-ledger conformance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TSD_MONGO_URL: mongodb://localhost:27017/tsd_test?directConnection=true
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .
          key: session-mongodb

      - name: Start a local MongoDB replica set
        run: .github/scripts/start-session-mongo-replset.sh 27017

      - name: Run MongoDB driver conformance
        run: cargo test --manifest-path integration-proofs/run-ledger-mongodb/Cargo.toml --features mongodb-storage-tests --test session_driver_conformance -- --ignored
